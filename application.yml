server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/guitarpro_db
    username: gp_user
    password: gp_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true


springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true

